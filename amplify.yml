# AWS Amplify Hosting — monorepo build spec (dashboard app)
# Console: check "My app is a monorepo" → Monorepo root directory = dashboard
# AMPLIFY_MONOREPO_APP_ROOT must equal appRoot below (console sets this automatically).

version: 1
applications:
  - appRoot: dashboard
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm install 20
            - nvm use 20
            - corepack enable
            - corepack prepare pnpm@9.15.0 --activate
            - pnpm config set store-dir .pnpm-store
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @agent-wallet/dashboard build
      artifacts:
        baseDirectory: dashboard/.next
        files:
          - "**/*"
      cache:
        paths:
          - .pnpm-store/**/*
          - node_modules/**/*
          - dashboard/node_modules/**/*
          - dashboard/.next/cache/**/*
    env:
      variables:
        NODE_VERSION: "20"
        NEXT_TELEMETRY_DISABLED: "1"
        # Override in Amplify Console → Environment variables if the API URL changes
        NEXT_PUBLIC_API_URL: https://gaq4ipibk8.execute-api.eu-north-1.amazonaws.com/dev
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: eu-north-1_0IJdwsjhj
        NEXT_PUBLIC_COGNITO_CLIENT_ID: 75qh4sjcosfd46l53adrlojlee
        NEXT_PUBLIC_COGNITO_DOMAIN: limitx-dev-609394380753
        NEXT_PUBLIC_COGNITO_REGION: eu-north-1
        NEXT_PUBLIC_COGNITO_REDIRECT_URI: https://main.d3ossfbvxnc0f7.amplifyapp.com/login/cognito
