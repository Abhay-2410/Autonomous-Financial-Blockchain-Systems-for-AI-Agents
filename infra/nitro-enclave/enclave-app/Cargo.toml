[package]
name = "enclave-app"
version = "0.1.0"
edition = "2021"
description = "LimitX Nitro Enclave vsock signer — independent policy enforcement + KMS Sign"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }
tokio-vsock = "0.5"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
aws-sigv4 = "1"
aws-credential-types = "1"
http = "1"
bytes = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
