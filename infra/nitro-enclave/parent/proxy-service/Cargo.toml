[package]
name = "limitx-parent-proxy"
version = "0.1.0"
edition = "2021"
description = "HTTP → vsock bridge from API Lambdas to the LimitX Nitro Enclave signer"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "time", "net"] }
tokio-vsock = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
