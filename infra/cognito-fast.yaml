# Cognito-only — deploys in ~1 minute (no Lambda packaging of full API)
AWSTemplateFormatVersion: "2010-09-09"
Description: LimitX Cognito User Pool + Hosted UI + auto-confirm for email signup

Parameters:
  Environment:
    Type: String
    Default: dev
  CognitoCallbackUrlLocal:
    Type: String
    Default: http://localhost:3000/login/cognito
  CognitoCallbackUrlPublic:
    Type: String
    Default: https://main.d3ossfbvxnc0f7.amplifyapp.com/login/cognito

Resources:
  PreSignUpAutoConfirm:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub limitx-cognito-presignup-${Environment}
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt PreSignUpRole.Arn
      Timeout: 5
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            event.response.autoConfirmUser = true;
            event.response.autoVerifyEmail = true;
            return event;
          };

  PreSignUpRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PreSignUpAutoConfirm
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt LimitXUserPool.Arn

  LimitXUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub limitx-users-${Environment}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpAutoConfirm.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false
      Schema:
        - Name: email
          Required: true
          Mutable: true

  LimitXUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub limitx-dashboard-${Environment}
      UserPoolId: !Ref LimitXUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - !Ref CognitoCallbackUrlLocal
        - !Ref CognitoCallbackUrlPublic
      LogoutURLs:
        - http://localhost:3000/login
        - https://main.d3ossfbvxnc0f7.amplifyapp.com/login
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  LimitXUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub limitx-${Environment}-${AWS::AccountId}
      UserPoolId: !Ref LimitXUserPool

Outputs:
  CognitoUserPoolId:
    Value: !Ref LimitXUserPool
  CognitoClientId:
    Value: !Ref LimitXUserPoolClient
  CognitoDomain:
    Value: !Ref LimitXUserPoolDomain
  CognitoHostedUiBase:
    Value: !Sub https://${LimitXUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  CognitoRegion:
    Value: !Ref AWS::Region
